<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DNM Auto — Import cost</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="lux-shell app-shell cost-page">
  <div class="lux-backdrop" aria-hidden="true">
    <img src="resources/hero-luxury.jpg" alt="">
  </div>

  <header class="lux-header">
    <nav class="lux-nav" aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="prices.html">Sold prices</a>
      <a href="cost.html" aria-current="page">Import cost</a>
    </nav>
    <a class="lux-logo" href="index.html" aria-label="DNM Auto home">
      <img src="resources/logo.png" alt="">
    </a>
    <div class="lux-header-right">
      <div class="lux-social" aria-label="Social">
        <a href="https://www.facebook.com/dnm.auto.sl" target="_blank" rel="noopener" aria-label="Facebook">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14.5 8.5V6.8c0-.7.5-1 1.2-1H17V3h-2.2C12.2 3 11 4.4 11 6.6v1.9H9v2.7h2V21h3.5v-9.8h2.3l.4-2.7h-2.7z"/></svg>
        </a>
        <a href="https://wa.me/94713466099" target="_blank" rel="noopener" aria-label="WhatsApp">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 3.5A10 10 0 0 0 3.3 17.7L2 22l4.4-1.2A10 10 0 1 0 20 3.5zm-8 16.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-2.5.7.7-2.4-.2-.3A8.2 8.2 0 1 1 12 19.7zm4.5-6.1c-.2-.1-1.4-.7-1.6-.8s-.4-.1-.5.1-.6.8-.7.9-.3.2-.5.1a6.7 6.7 0 0 1-2-1.2 7.4 7.4 0 0 1-1.4-1.7c-.1-.3 0-.4.1-.5l.4-.4.2-.3.1-.3-.1-.4c0-.1-.5-1.2-.7-1.6s-.4-.4-.5-.4h-.4c-.1 0-.4.1-.6.3s-.8.8-.8 1.9.8 2.2.9 2.3a9.5 9.5 0 0 0 3.7 3.1c1.4.6 1.9.6 2.6.5.4-.1 1.4-.6 1.6-1.1s.2-1 .1-1.1-.2-.2-.4-.3z"/></svg>
        </a>
      </div>
      <a class="btn-pill btn-ghost-light" href="https://wa.me/94713466099" target="_blank" rel="noopener">WhatsApp</a>
    </div>
  </header>
  <nav class="lux-mobile-nav" aria-label="Pages">
    <a href="index.html">Home</a>
    <a href="prices.html">Sold prices</a>
    <a href="cost.html" aria-current="page">Import cost</a>
  </nav>

  <main class="cost-layout">
    <section class="sheet sheet-input">
      <div class="sheet-head stack">
        <div>
          <h2>Input</h2>
          <p class="fine">Set the vehicle and bid details, then calculate.</p>
        </div>
      </div>
      <div class="cost-fields">
        <label>Vehicle model
          <select id="vehicle">
            <option value="Alto">Alto</option>
            <option value="Aqua">Aqua</option>
            <option value="Audi A3">Audi A3</option>
            <option value="Axio">Axio</option>
            <option value="C-HR">C-HR</option>
            <option value="Corolla cross">Corolla cross</option>
            <option value="CR-V">CR-V</option>
            <option value="EK Wagon">EK Wagon</option>
            <option value="Every">Every</option>
            <option value="Fit HV">Fit HV</option>
            <option value="Flair">Flair</option>
            <option value="Honda WR-V">Honda WR-V</option>
            <option value="Hustler">Hustler</option>
            <option value="Leaf">Leaf</option>
            <option value="Mira">Mira</option>
            <option value="Move">Move</option>
            <option value="Nissan Dayz">Nissan Dayz</option>
            <option value="Note">Note</option>
            <option value="Raize" selected>Raize</option>
            <option value="Rocky">Rocky</option>
            <option value="Roomy">Roomy</option>
            <option value="ROOX">ROOX</option>
            <option value="Spacia">Spacia</option>
            <option value="Swift">Swift</option>
            <option value="TAFT">TAFT</option>
            <option value="THOR">THOR</option>
            <option value="Vezel HV">Vezel HV</option>
            <option value="Wagon R">Wagon R</option>
            <option value="X bee">X bee</option>
            <option value="Yaris">Yaris</option>
            <option value="Yaris Cross">Yaris Cross</option>
          </select>
        </label>
        <label>Grade
          <select id="vehicleVariant"></select>
        </label>
        <label class="span-2">Tax category
          <select id="taxcategory">
            <option value="hybrid_under_1000">Under 1000cc hybrid</option>
            <option value="petrol_under_1000">Under 1000cc petrol</option>
            <option value="hybrid_1000_1300">1000–1300cc hybrid</option>
            <option value="petrol_1000_1300">1000–1300cc petrol</option>
            <option value="hybrid_1300_1500">1300–1500cc hybrid</option>
            <option value="petrol_1300_1500" selected>1300–1500cc petrol</option>
            <option value="hybrid_1500_1600">1500–1600cc hybrid</option>
            <option value="hybrid_1600_1800">1600–1800cc hybrid</option>
            <option value="hev_50_100_1year">50–100kW HEV, under 1 year</option>
            <option value="hev_50_100_3year">50–100kW HEV, over 1 year</option>
          </select>
        </label>
        <label>A/V FOB, JPY <input type="number" id="taxbase" value="1000" min="0" step="1"></label>
        <label>Engine, cc <input type="number" id="capacity" value="660" min="0" step="1"></label>
        <label>Bid, JPY <input type="number" id="winningBid" value="2000000" min="0" step="10000"></label>
        <label>JPY rate <input type="number" id="yenrate" value="2.1" min="0.1" step="0.1"></label>
        <label>Clearing, LKR <input type="number" id="clearing" value="100000" min="0" step="10000"></label>
        <label>SSCL rate <input type="number" id="sscl" value="2.5" min="0" step="0.1"></label>
      </div>
      <div class="actions">
        <button type="button" class="primary" id="calculateBtn">Calculate import cost</button>
      </div>
      <p class="fine note-line">Tax figures follow the Sri Lankan import rules used by DNM Auto. Exchange rates and regulations may change.</p>
      <div hidden>
        <select id="exporter">
          <option value="1" selected>A</option>
          <option value="2">B</option>
        </select>
        <input type="number" id="areaCost" value="8000">
        <input type="number" id="auctionFee" value="300000">
        <input type="number" id="tt" value="290000">
      </div>
    </section>

    <section class="sheet sheet-cost">
      <h2>Cost breakdown</h2>
      <div id="vehicleInfo" class="vehicle-info"></div>
      <div id="earlyResults" class="results-grid"></div>
      <div class="tax-block">
        <div class="sheet-head compact">
          <h3>Tax breakdown</h3>
          <label class="check" for="surchargeToggle">
            <input type="checkbox" id="surchargeToggle" checked>
            Surcharge, 50% of CID
            <span id="surchargeToggleState">On</span>
          </label>
        </div>
        <div id="taxBreakdown"></div>
      </div>
      <div id="lateResults" class="results-grid"></div>
      <div id="totalPayable"></div>
    </section>
  </main>

  <script src="nav-transition.js" defer></script>
  <script src="cost.js"></script>
</body>
</html>
