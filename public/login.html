<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    try { if (localStorage.getItem("dnm-theme") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}
  </script>
  <title>DNM Auto — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="theme-light.css">
</head>
<body class="lux-shell app-shell login-page">
  <div class="lux-backdrop" aria-hidden="true">
    <img src="resources/hero-luxury.jpg" alt="">
  </div>

  <header class="lux-header">
    <nav class="lux-nav" aria-label="Primary">
      <a href="./">Home</a>
      <a href="prices.html">Sold prices</a>
      <a href="cost.html">Import cost</a>
    </nav>
    <a class="lux-logo" href="./" aria-label="DNM Auto home">
      <img src="resources/logo.png" alt="">
    </a>
    <div class="lux-header-right">
      <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="true" aria-label="Turn off dark mode">
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span class="theme-toggle-label">Dark</span>
      </button>
      <a class="btn-pill btn-ghost-light header-action" href="tel:+94778472900" aria-label="Let's talk"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.5-1.1a2 2 0 0 1 2.1-.4c.8.3 1.7.5 2.6.6a2 2 0 0 1 1.7 2z"/></svg><span class="header-action-label">Let's talk</span></a>
    </div>
  </header>
  <nav class="lux-mobile-nav" aria-label="Pages">
    <a href="./">Home</a>
    <a href="prices.html">Sold prices</a>
    <a href="cost.html">Import cost</a>
  </nav>

  <main>
    <section class="sheet login-card">
      <div class="sheet-head stack">
        <div>
          <h2>Sign in</h2>
          <p class="fine">Import cost is available to signed-in customers.</p>
        </div>
      </div>
      <form id="login-form" class="cost-fields">
        <label>Username
          <input name="username" autocomplete="username" required>
        </label>
        <label>Password
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="primary" type="submit">Sign in</button>
      </form>
      <p id="login-note" class="fine login-note" role="status"></p>
      <p class="fine">No account yet? Call and we will set one up for you.</p>
      <a class="btn-pill btn-ghost-light login-call" href="tel:+94778472900">Call to sign up</a>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="theme.js" defer></script>
  <script src="nav-transition.js" defer></script>
  <script src="login.js" defer></script>
</body>
</html>
